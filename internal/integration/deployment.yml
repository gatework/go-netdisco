---
database:
  name: netdisco
  host: postgres
  user: netdisco
  pass: fixture-password
tenant_databases:
  - tag: lab
    displayname: Integration tenant
    name: netdisco_tenant
    host: postgres
    user: netdisco
    pass: fixture-password
no_auth: false
allow_permanent_tokens: true
api_token_lifetime: 3600
health_path: /health
log: warning
site_local_files: false
custom_fields:
  device:
    - name: owner
      label: Owner
reports:
  - tag: integration-custom
    category: My Reports
    label: Integration Custom
    columns:
      - {answer: Answer}
      - {label: Label}
    bind_params: [label]
    query: "SELECT 42::bigint AS answer, COALESCE(NULLIF(?, ''), 'fixture')::text AS label"
